version: 2
updates:
  - package-ecosystem: npm
    directory: /jira-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: npm
    directory: /jira-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: pip
    directory: /jira-openapi/contract
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directory: /jira-docker/jira-backend
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: docker
    directory: /jira-docker/jira-frontend
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
