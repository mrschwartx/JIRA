name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: openapi spec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jira-openapi/contract/requirements.txt
      - run: pip install -r jira-openapi/contract/requirements.txt
      - run: python jira-openapi/contract/contract_test.py --validate-only

  backend-quality:
    name: backend code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jira-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jira-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  backend-test:
    name: backend tests
    runs-on: ubuntu-latest
    needs: [backend-quality]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jira-backend
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jira-backend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run test:coverage

  contract:
    name: api matches openapi
    runs-on: ubuntu-latest
    needs: [openapi, backend-quality]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jira_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_PORT: 8080
      APP_HOST: 127.0.0.1
      APP_LEVEL: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/jira_contract
      AUTH_SECRET: ci-contract-secret-with-more-than-32-characters
      BCRYPT_ROUNDS: 4
      AUTH_RATE_LIMIT_MAX: 1000
      LOG_TO_FILE: false
      LOG_SILENT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jira-backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jira-openapi/contract/requirements.txt
      - run: npm ci
        working-directory: jira-backend
      - run: pip install -r jira-openapi/contract/requirements.txt
      - name: Start the API
        working-directory: jira-backend
        run: |
          node src/main.js > ../api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ../api.log
          exit 1
      - name: Verify every operation against the spec
        run: python jira-openapi/contract/contract_test.py
      - name: Show API logs on failure
        if: failure()
        run: cat api.log

  frontend-quality:
    name: frontend code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jira-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jira-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: jira-frontend/coverage
          retention-days: 7

  frontend-build:
    name: frontend production build
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jira-frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_SERVER_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jira-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: docker stack
    runs-on: ubuntu-latest
    needs: [backend-test, contract, frontend-build]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: jira-docker
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Prepare environment
        run: make docker/env
      - name: Start the stack
        run: make docker/up
      - name: Check the API health endpoint
        run: curl -fsS http://localhost:8080/
      - name: Check the frontend health endpoint
        run: curl -fsS http://localhost:3000/ping
      - name: Check the frontend pages
        run: |
          for path in / /signin /signup /projects /profile /projects/sample/board /projects/sample/board/issues/sample /projects/sample/settings; do
            curl -fsS http://localhost:3000$path | grep -q '<title>Jira</title>'
          done
      - name: Seed demo data
        run: |
          make docker/seed
          make docker/seed
      - name: Check the seeded project through the API
        run: |
          curl -fsS -c cookies.txt -X POST http://localhost:8080/api/v1/auth/signin \
            -H 'Content-Type: application/json' \
            -d '{"email":"alice@mail.com","password":"password123"}'
          curl -fsS -b cookies.txt http://localhost:8080/api/v1/projects | grep -q '"key":"JIRA"'
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml ps -a
          docker inspect --format '{{json .State.Health}}' jira-backend
          echo "=== backend logs"
          docker logs jira-backend 2>&1 | tail -n 100
          echo "=== frontend logs"
          docker logs jira-frontend 2>&1 | tail -n 100
          echo "=== postgres logs"
          docker logs jira-postgres 2>&1 | tail -n 30
      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml down -v
