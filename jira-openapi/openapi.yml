openapi: 3.1.0
info:
  title: Jira API
  description: |
    REST API for a Jira style project and issue tracker, built on Express and PostgreSQL.

    Authentication uses an HttpOnly cookie named jira_token that is set by sign up and sign in
    and lasts one hour. Clients must send requests with credentials included.

    Projects are the unit of access control. A user can only see and change a project when they
    are a member of it. Requests for projects the caller does not belong to answer 404, exactly as
    if the project did not exist. Only the owner can change or delete a project and manage members.

    Errors share one shape: an object with a numeric status and a human readable message.
    Sign up and sign in are rate limited per client address and answer 429 when the limit is hit.
  contact:
    name: Jira
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  version: 3.0.0
tags:
  - name: Auth
  - name: Users
  - name: Projects
  - name: Members
  - name: Issues
  - name: Comments
  - name: System
servers:
  - url: http://localhost:8080/api/v1
security:
  - CookieAuth: []
paths:
  /:
    get:
      tags:
        - System
      summary: Service health
      description: Returns a welcome message. Used as the container health check.
      operationId: getHealth
      security: []
      servers:
        - url: http://localhost:8080
      responses:
        '200':
          description: The service is running
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
              example:
                message: Welcome to the Jira API
  /auth/signup:
    post:
      tags:
        - Auth
      summary: Register a new user
      operationId: signUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: The user was created and signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/signin:
    post:
      tags:
        - Auth
      summary: Sign in
      description: Unknown emails and wrong passwords answer with the same 401 message.
      operationId: signIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: The user was signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/signout:
    post:
      tags:
        - Auth
      summary: Sign out
      description: Clears the session cookie.
      operationId: signOut
      security: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get the signed in user
      operationId: getCurrentUser
      responses:
        '200':
          description: The signed in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /users:
    get:
      tags:
        - Users
      summary: Search users
      description: Case insensitive substring search over username and email. Returns at most 20 users.
      operationId: searchUsers
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: Matching users, possibly empty
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users
      summary: Get a user
      operationId: getUser
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Users
      summary: Update your own account
      description: Fields other than username, email and password are ignored. Other accounts answer 401.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Users
      summary: Delete your own account
      description: Ends the session and removes the avatar. Owned projects are deleted with the account.
      operationId: deleteUser
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/avatar:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags:
        - Users
      summary: Replace your own avatar
      description: Accepts one JPEG, PNG, WEBP or GIF image of at most 2 MB in the avatar field.
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  contentEncoding: binary
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects:
    get:
      tags:
        - Projects
      summary: List your projects
      description: Every project the signed in user is a member of, oldest first.
      operationId: listProjects
      responses:
        '200':
          description: Projects of the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Projects
      summary: Create a project
      description: The creator becomes the owner and first member. The key must be unique.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: The created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Projects
      summary: Get a project
      operationId: getProject
      responses:
        '200':
          description: The project with the role of the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Projects
      summary: Update a project
      description: Owner only. The key cannot be changed and is ignored.
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: The updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Projects
      summary: Delete a project
      description: Owner only. Issues, comments and memberships are deleted with it.
      operationId: deleteProject
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Members
      summary: List project members
      description: The owner comes first, then members by username.
      operationId: listMembers
      responses:
        '200':
          description: Members of the project
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Members
      summary: Add a member
      description: Owner only. Use the user search to find the id of the person to add.
      operationId: addMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: The new member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags:
        - Members
      summary: Remove a member
      description: >-
        The owner can remove any member. Members can only remove themselves. The owner can never be
        removed. Removing a member unassigns them from every issue of the project.
      operationId: removeMember
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/issues:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Issues
      summary: List or search issues
      description: >-
        Returns issues ordered by list position, at most 1000. The search term matches the title and
        description case insensitively and treats percent and underscore literally.
      operationId: listIssues
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IssueStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/IssueType'
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matching issues
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Issues
      summary: Create an issue
      description: >-
        The issue gets the next number of the project and is placed at the top of its column. Any
        list position, number or project id in the body is ignored. The reporter defaults to the
        caller. Reporter and assignees must be project members.
      operationId: createIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
      responses:
        '201':
          description: The created issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/issues/{issueId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IssueId'
    get:
      tags:
        - Issues
      summary: Get an issue
      operationId: getIssue
      responses:
        '200':
          description: The issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Issues
      summary: Update an issue
      description: >-
        Partial update used for inline edits and for dragging cards, which sends a status and a list
        position. Sending assigneeIds replaces the assignees. Time values accept null to clear them.
        Unknown fields are ignored.
      operationId: updateIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueRequest'
      responses:
        '200':
          description: The updated issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Issues
      summary: Delete an issue
      description: Comments are deleted with the issue.
      operationId: deleteIssue
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/issues/{issueId}/comments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IssueId'
    get:
      tags:
        - Comments
      summary: List comments of an issue
      description: Newest first.
      operationId: listComments
      responses:
        '200':
          description: Comments of the issue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Comments
      summary: Comment on an issue
      description: The author is always the caller.
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '201':
          description: The created comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/issues/{issueId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IssueId'
      - $ref: '#/components/parameters/CommentId'
    patch:
      tags:
        - Comments
      summary: Edit a comment
      description: Only the author can edit a comment.
      operationId: updateComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200':
          description: The updated comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Comments
      summary: Delete a comment
      description: The author or the project owner can delete a comment.
      operationId: deleteComment
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: jira_token
      description: HttpOnly session cookie issued by sign up and sign in.
  headers:
    SessionCookie:
      description: Sets the jira_token session cookie, HttpOnly and valid for one hour.
      schema:
        type: string
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        status:
          type: integer
        message:
          type: string
    User:
      type: object
      required:
        - id
        - username
        - email
        - avatar
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          maxLength: 254
        avatar:
          type: string
          description: Path of the avatar on the API origin.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SignUpRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
          format: password
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    ProjectCategory:
      type: string
      enum:
        - software
        - marketing
        - business
    MemberRole:
      type: string
      enum:
        - owner
        - member
    Project:
      type: object
      required:
        - id
        - key
        - name
        - url
        - description
        - category
        - ownerId
        - role
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          pattern: ^[A-Z][A-Z0-9]{1,9}$
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type:
            - string
            - 'null'
          maxLength: 2048
        description:
          type: string
          maxLength: 10000
        category:
          $ref: '#/components/schemas/ProjectCategory'
        ownerId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/MemberRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      required:
        - key
        - name
      properties:
        key:
          type: string
          description: Two to ten letters or digits starting with a letter. Lower case input is upper cased.
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          $ref: '#/components/schemas/ProjectCategory'
        url:
          type:
            - string
            - 'null'
          description: An http or https URL.
        description:
          type: string
          maxLength: 10000
    UpdateProjectRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          $ref: '#/components/schemas/ProjectCategory'
        url:
          type:
            - string
            - 'null'
        description:
          type: string
          maxLength: 10000
    Member:
      type: object
      required:
        - id
        - username
        - email
        - avatar
        - role
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        avatar:
          type: string
        role:
          $ref: '#/components/schemas/MemberRole'
    AddMemberRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid
    IssueType:
      type: string
      enum:
        - task
        - bug
        - story
    IssueStatus:
      type: string
      description: The board column of the issue.
      enum:
        - backlog
        - selected
        - inprogress
        - done
    IssuePriority:
      type: string
      enum:
        - lowest
        - low
        - medium
        - high
        - highest
    Hours:
      type:
        - integer
        - 'null'
      minimum: 0
      maximum: 10000
    Issue:
      type: object
      required:
        - id
        - projectId
        - number
        - title
        - type
        - status
        - priority
        - listPosition
        - description
        - estimate
        - timeSpent
        - timeRemaining
        - reporterId
        - assigneeIds
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
          description: Sequence number inside the project. Combine it with the project key, for example JIRA-12.
        title:
          type: string
          minLength: 1
          maxLength: 200
        type:
          $ref: '#/components/schemas/IssueType'
        status:
          $ref: '#/components/schemas/IssueStatus'
        priority:
          $ref: '#/components/schemas/IssuePriority'
        listPosition:
          type: number
          description: Ascending sort key inside a column. Place a card between two others by using the midpoint of their positions.
        description:
          type: string
          maxLength: 20000
          description: Plain text. Clients must render it as text and never as HTML.
        estimate:
          $ref: '#/components/schemas/Hours'
        timeSpent:
          $ref: '#/components/schemas/Hours'
        timeRemaining:
          $ref: '#/components/schemas/Hours'
        reporterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Null after the reporter deleted their account.
        assigneeIds:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateIssueRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        type:
          $ref: '#/components/schemas/IssueType'
        status:
          $ref: '#/components/schemas/IssueStatus'
        priority:
          $ref: '#/components/schemas/IssuePriority'
        description:
          type: string
          maxLength: 20000
        estimate:
          $ref: '#/components/schemas/Hours'
        timeSpent:
          $ref: '#/components/schemas/Hours'
        timeRemaining:
          $ref: '#/components/schemas/Hours'
        reporterId:
          type: string
          format: uuid
        assigneeIds:
          type: array
          items:
            type: string
            format: uuid
    UpdateIssueRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        type:
          $ref: '#/components/schemas/IssueType'
        status:
          $ref: '#/components/schemas/IssueStatus'
        priority:
          $ref: '#/components/schemas/IssuePriority'
        listPosition:
          type: number
        description:
          type: string
          maxLength: 20000
        estimate:
          $ref: '#/components/schemas/Hours'
        timeSpent:
          $ref: '#/components/schemas/Hours'
        timeRemaining:
          $ref: '#/components/schemas/Hours'
        reporterId:
          type: string
          format: uuid
        assigneeIds:
          type: array
          items:
            type: string
            format: uuid
    CommentAuthor:
      type: object
      required:
        - id
        - username
        - avatar
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        avatar:
          type: string
    Comment:
      type: object
      required:
        - id
        - issueId
        - body
        - author
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        issueId:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
          maxLength: 5000
        author:
          description: Null after the author deleted their account.
          oneOf:
            - $ref: '#/components/schemas/CommentAuthor'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CommentRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
  responses:
    NoContent:
      description: Success without a response body
    ValidationError:
      description: The request is malformed or violates a validation rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 400
            message: Issue title must be between 1 and 200 characters
    Unauthorized:
      description: The session cookie is missing, invalid or expired, or the credentials are wrong
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 401
            message: 'Unauthorized: Token not provided'
    Forbidden:
      description: The caller is a member but lacks the role needed for this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 403
            message: Only the project owner can update the project
    NotFound:
      description: The resource does not exist, or belongs to a project the caller is not a member of
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 404
            message: Project not found!
    Conflict:
      description: The resource already exists, for example a duplicate email, username or project key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 422
            message: Project key is already in use.
    TooManyRequests:
      description: Too many authentication attempts from this client address
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 429
            message: Too many attempts. Please try again later.
